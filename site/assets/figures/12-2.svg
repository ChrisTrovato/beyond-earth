<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 224" width="880" height="448" role="img" aria-labelledby="figure-title figure-description"><title id="figure-title">Operational sensing and personal space</title><desc id="figure-description">Operational sensing and personal space. Conceptual information boundary. Equipment telemetry and private life need different access rules.</desc><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="440" height="224" rx="7" fill="#f4f1e9" stroke="none" stroke-width="1"/><rect x="20" y="45" width="170" height="140" rx="5" fill="#ffffff" stroke="#147d80" stroke-width="0.6"/><rect x="245" y="45" width="175" height="140" rx="5" fill="#ffffff" stroke="#147d80" stroke-width="0.6"/><text x="35" y="73" fill="#147d80" font-size="12" font-weight="700">SYSTEM DATA</text><text x="260" y="73" fill="#ac643e" font-size="12" font-weight="700">PERSONAL SPACE</text><text x="35" y="107" fill="#102c3b" font-size="11" font-weight="400">Pressure / flow /</text><text x="35" y="120" fill="#102c3b" font-size="11" font-weight="400">temperature / equipment</text><text x="35" y="133" fill="#102c3b" font-size="11" font-weight="400">state</text><text x="260" y="107" fill="#102c3b" font-size="11" font-weight="400">Private activities /</text><text x="260" y="120" fill="#102c3b" font-size="11" font-weight="400">conversations / personal</text><text x="260" y="133" fill="#102c3b" font-size="11" font-weight="400">records</text><line x1="218" y1="30" x2="218" y2="202" fill="none" stroke="#ac643e" stroke-width="2" stroke-linecap="round"/></g></svg>