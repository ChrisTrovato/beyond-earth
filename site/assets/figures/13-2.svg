<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 224" width="880" height="448" role="img" aria-labelledby="figure-title figure-description"><title id="figure-title">An orbital yard needs reaction paths</title><desc id="figure-description">An orbital yard needs reaction paths. Schematic: robot, workpiece and fixture form a coupled system. Free fall does not remove inertia.</desc><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="440" height="224" rx="7" fill="#f4f1e9" stroke="none" stroke-width="1"/><line x1="35" y1="180" x2="400" y2="180" fill="none" stroke="#147d80" stroke-width="4" stroke-linecap="round"/><rect x="38" y="140" width="62" height="38" rx="5" fill="#dfe8e5" stroke="#147d80" stroke-width="0.6"/><text x="45" y="163.5" fill="#102c3b" font-size="9.5" font-weight="400">Base</text><line x1="70" y1="140" x2="135" y2="77" fill="none" stroke="#147d80" stroke-width="7" stroke-linecap="round"/><line x1="135" y1="77" x2="224" y2="89" fill="none" stroke="#147d80" stroke-width="6" stroke-linecap="round"/><circle cx="135" cy="77" r="9" fill="none" stroke="#147d80" stroke-width="6"/><rect x="245" y="50" width="128" height="83" rx="5" fill="#dfe8e5" stroke="#147d80" stroke-width="0.6"/><text x="252" y="96" fill="#102c3b" font-size="9.5" font-weight="400">Workpiece</text><line x1="274" y1="135" x2="274" y2="178" fill="none" stroke="#65777c" stroke-width="3" stroke-linecap="round"/><line x1="350" y1="135" x2="350" y2="178" fill="none" stroke="#65777c" stroke-width="3" stroke-linecap="round"/><line x1="222" y1="90" x2="243" y2="90" fill="none" stroke="#147d80" stroke-width="1.3" stroke-linecap="round"/><line x1="243" y1="90" x2="237.735" y2="92.8766" fill="none" stroke="#147d80" stroke-width="1.3" stroke-linecap="round"/><line x1="243" y1="90" x2="237.735" y2="87.1234" fill="none" stroke="#147d80" stroke-width="1.3" stroke-linecap="round"/><text x="212" y="205" fill="#147d80" font-size="10" font-weight="400">Fixture carries reaction loads</text><text x="20" y="26" fill="#65777c" font-size="9" font-weight="400">Robot + base move together unless constrained</text></g></svg>