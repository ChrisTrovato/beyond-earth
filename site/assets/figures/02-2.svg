<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 224" width="880" height="448" role="img" aria-labelledby="figure-title figure-description"><title id="figure-title">Three configurations, three claims</title><desc id="figure-description">Three configurations, three claims. Fictional lifecycle states. E2 is a proposal needing new budgets; it does not inherit M1 capacity.</desc><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="440" height="224" rx="7" fill="#f4f1e9" stroke="none" stroke-width="1"/><rect x="18" y="45" width="122" height="138" rx="5" fill="#dfe8e5" stroke="#147d80" stroke-width="0.6"/><text x="30" y="83" fill="#147d80" font-size="25" font-weight="700">P0</text><text x="30" y="119" fill="#102c3b" font-size="11" font-weight="400">No residents</text><text x="30" y="154" fill="#65777c" font-size="9" font-weight="400">Deploy / verify</text><rect x="159" y="45" width="122" height="138" rx="5" fill="#dfe8e5" stroke="#147d80" stroke-width="0.6"/><text x="171" y="83" fill="#147d80" font-size="25" font-weight="700">M1</text><text x="171" y="119" fill="#102c3b" font-size="11" font-weight="400">12 adults</text><text x="171" y="154" fill="#65777c" font-size="9" font-weight="400">Reference budgets</text><rect x="300" y="45" width="122" height="138" rx="5" fill="#dfe8e5" stroke="#147d80" stroke-width="0.6"/><text x="312" y="83" fill="#147d80" font-size="25" font-weight="700">E2</text><text x="312" y="119" fill="#102c3b" font-size="11" font-weight="400">24 proposed</text><text x="312" y="154" fill="#65777c" font-size="9" font-weight="400">Resize / requalify</text></g></svg>