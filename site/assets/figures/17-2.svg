<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 224" width="880" height="448" role="img" aria-labelledby="figure-title figure-description"><title id="figure-title">A dimension needs a reference</title><desc id="figure-description">A dimension needs a reference. Schematic datum and measurement chain. Instrument resolution alone is not measurement uncertainty.</desc><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="440" height="224" rx="7" fill="#f4f1e9" stroke="none" stroke-width="1"/><rect x="45" y="86" width="170" height="75" rx="5" fill="#dfe8e5" stroke="#147d80" stroke-width="0.6"/><text x="52" y="128" fill="#102c3b" font-size="9.5" font-weight="400">Part</text><line x1="30" y1="170" x2="240" y2="170" fill="none" stroke="#147d80" stroke-width="4" stroke-linecap="round"/><text x="56" y="193" fill="#147d80" font-size="10" font-weight="400">Datum surface</text><line x1="268" y1="55" x2="268" y2="159" fill="none" stroke="#147d80" stroke-width="1.3" stroke-linecap="round"/><line x1="268" y1="159" x2="265.123" y2="153.735" fill="none" stroke="#147d80" stroke-width="1.3" stroke-linecap="round"/><line x1="268" y1="159" x2="270.877" y2="153.735" fill="none" stroke="#147d80" stroke-width="1.3" stroke-linecap="round"/><line x1="219" y1="86" x2="279" y2="86" fill="none" stroke="#65777c" stroke-width="1" stroke-linecap="round"/><line x1="219" y1="161" x2="279" y2="161" fill="none" stroke="#65777c" stroke-width="1" stroke-linecap="round"/><text x="292" y="114" fill="#102c3b" font-size="10" font-weight="400">Measured feature</text><rect x="40" y="25" width="174" height="37" rx="5" fill="#dfe8e5" stroke="#147d80" stroke-width="0.6"/><text x="47" y="48" fill="#102c3b" font-size="9.5" font-weight="400">Reference + method + uncertainty</text></g></svg>