<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 224" width="880" height="448" role="img" aria-labelledby="figure-title figure-description"><title id="figure-title">Design the task as well as the robot</title><desc id="figure-description">Design the task as well as the robot. Schematic guided interface: lead-in geometry and a fixture can reduce uncertainty before final engagement.</desc><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="440" height="224" rx="7" fill="#f4f1e9" stroke="none" stroke-width="1"/><rect x="35" y="85" width="110" height="72" rx="5" fill="#dfe8e5" stroke="#147d80" stroke-width="0.6"/><text x="42" y="125.5" fill="#102c3b" font-size="9.5" font-weight="400">Carried part</text><rect x="294" y="55" width="100" height="129" rx="5" fill="#dfe8e5" stroke="#147d80" stroke-width="0.6"/><text x="301" y="124" fill="#102c3b" font-size="9.5" font-weight="400">Fixture</text><line x1="265" y1="60" x2="293" y2="93" fill="none" stroke="#147d80" stroke-width="3" stroke-linecap="round"/><line x1="265" y1="180" x2="293" y2="147" fill="none" stroke="#147d80" stroke-width="3" stroke-linecap="round"/><line x1="153" y1="120" x2="261" y2="120" fill="none" stroke="#147d80" stroke-width="1.3" stroke-linecap="round"/><line x1="261" y1="120" x2="255.735" y2="122.877" fill="none" stroke="#147d80" stroke-width="1.3" stroke-linecap="round"/><line x1="261" y1="120" x2="255.735" y2="117.123" fill="none" stroke="#147d80" stroke-width="1.3" stroke-linecap="round"/><text x="202" y="41" fill="#147d80" font-size="11" font-weight="400">Lead-in</text><text x="30" y="212" fill="#65777c" font-size="9" font-weight="400">Guide geometry reduces alignment uncertainty</text></g></svg>