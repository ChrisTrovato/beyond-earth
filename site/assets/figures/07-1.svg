<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 224" width="880" height="448" role="img" aria-labelledby="figure-title figure-description"><title id="figure-title">The pressure boundary has several jobs</title><desc id="figure-description">The pressure boundary has several jobs. Schematic cutaway. Shielding, insulation, pressure containment and interior finish are different functions.</desc><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="440" height="224" rx="7" fill="#f4f1e9" stroke="none" stroke-width="1"/><rect x="30" y="26" width="230" height="170" rx="5" fill="#ceb99f" stroke="#147d80" stroke-width="0.6"/><rect x="45" y="42" width="200" height="138" rx="5" fill="#dee4e2" stroke="#147d80" stroke-width="0.6"/><rect x="59" y="55" width="172" height="112" rx="5" fill="#147d80" stroke="#147d80" stroke-width="0.6"/><rect x="65" y="61" width="160" height="100" rx="5" fill="#ffffff" stroke="#147d80" stroke-width="0.6"/><circle cx="253" cy="80" r="2" fill="#147d80" stroke="#147d80" stroke-width="0.6"/><line x1="253" y1="80" x2="273" y2="80" fill="none" stroke="#65777c" stroke-width="1" stroke-linecap="round"/><line x1="273" y1="80" x2="283" y2="42" fill="none" stroke="#65777c" stroke-width="1" stroke-linecap="round"/><text x="294" y="42.5" fill="#102c3b" font-size="9.5" font-weight="400">Local shielding</text><circle cx="238" cy="98" r="2" fill="#147d80" stroke="#147d80" stroke-width="1"/><line x1="238" y1="98" x2="273" y2="98" fill="none" stroke="#65777c" stroke-width="1" stroke-linecap="round"/><line x1="273" y1="98" x2="283" y2="84" fill="none" stroke="#65777c" stroke-width="1" stroke-linecap="round"/><text x="294" y="84.5" fill="#102c3b" font-size="9.5" font-weight="400">Insulation / protection</text><circle cx="228" cy="123" r="2" fill="#147d80" stroke="#147d80" stroke-width="1"/><line x1="228" y1="123" x2="273" y2="123" fill="none" stroke="#65777c" stroke-width="1" stroke-linecap="round"/><line x1="273" y1="123" x2="283" y2="128" fill="none" stroke="#65777c" stroke-width="1" stroke-linecap="round"/><text x="294" y="128.5" fill="#102c3b" font-size="9.5" font-weight="400">Pressure boundary</text><circle cx="175" cy="144" r="2" fill="#147d80" stroke="#147d80" stroke-width="1"/><line x1="175" y1="144" x2="273" y2="144" fill="none" stroke="#65777c" stroke-width="1" stroke-linecap="round"/><line x1="273" y1="144" x2="283" y2="172" fill="none" stroke="#65777c" stroke-width="1" stroke-linecap="round"/><text x="294" y="172.5" fill="#102c3b" font-size="9.5" font-weight="400">Interior / access</text><text x="24" y="215" fill="#65777c" font-size="8" font-weight="400">Roles shown separately; thicknesses not to scale.</text></g></svg>