<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 224" width="880" height="448" role="img" aria-labelledby="figure-title figure-description"><title id="figure-title">Ordinary life shares infrastructure</title><desc id="figure-description">Ordinary life shares infrastructure. Illustrative activity map rather than a prescribed schedule. Several activities can compete for the same services.</desc><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="440" height="224" rx="7" fill="#f4f1e9" stroke="none" stroke-width="1"/><text x="24" y="32" fill="#147d80" font-size="11" font-weight="700">Wash</text><rect x="125" y="13" width="290" height="32" rx="5" fill="#dfe8e5" stroke="#147d80" stroke-width="0.6"/><text x="132" y="33.5" fill="#102c3b" font-size="9.5" font-weight="400">Water + ventilation</text><text x="24" y="72" fill="#147d80" font-size="11" font-weight="700">Eat</text><rect x="125" y="53" width="290" height="32" rx="5" fill="#dfe8e5" stroke="#147d80" stroke-width="0.6"/><text x="132" y="73.5" fill="#102c3b" font-size="9.5" font-weight="400">Storage + preparation</text><text x="24" y="112" fill="#147d80" font-size="11" font-weight="700">Work</text><rect x="125" y="93" width="290" height="32" rx="5" fill="#dfe8e5" stroke="#147d80" stroke-width="0.6"/><text x="132" y="113.5" fill="#102c3b" font-size="9.5" font-weight="400">Power + tools</text><text x="24" y="152" fill="#147d80" font-size="11" font-weight="700">Exercise</text><rect x="125" y="133" width="290" height="32" rx="5" fill="#dfe8e5" stroke="#147d80" stroke-width="0.6"/><text x="132" y="153.5" fill="#102c3b" font-size="9.5" font-weight="400">Space + cooling</text><text x="24" y="192" fill="#147d80" font-size="11" font-weight="700">Rest</text><rect x="125" y="173" width="290" height="32" rx="5" fill="#dfe8e5" stroke="#147d80" stroke-width="0.6"/><text x="132" y="193.5" fill="#102c3b" font-size="9.5" font-weight="400">Quiet + privacy</text></g></svg>