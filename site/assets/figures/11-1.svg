<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 224" width="880" height="448" role="img" aria-labelledby="figure-title figure-description"><title id="figure-title">Two branches are not full redundancy</title><desc id="figure-description">Two branches are not full redundancy. Fictional 100 kW thermal case, two 60 kW branches at assumed conditions. One isolated branch requires at least 40 kW shedding.</desc><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="440" height="224" rx="7" fill="#f4f1e9" stroke="none" stroke-width="1"/><rect x="17" y="77" width="100" height="62" rx="5" fill="#dfe8e5" stroke="#147d80" stroke-width="0.6"/><text x="24" y="112.5" fill="#102c3b" font-size="9.5" font-weight="400">100 kW load</text><rect x="179" y="27" width="110" height="55" rx="5" fill="#dfe8e5" stroke="#147d80" stroke-width="0.6"/><text x="186" y="59" fill="#102c3b" font-size="9.5" font-weight="400">Branch A: 60 kW</text><rect x="179" y="139" width="110" height="55" rx="5" fill="#dfe8e5" stroke="#147d80" stroke-width="0.6"/><text x="186" y="171" fill="#102c3b" font-size="9.5" font-weight="400">Branch B: 60 kW</text><rect x="342" y="80" width="80" height="60" rx="5" fill="#dfe8e5" stroke="#147d80" stroke-width="0.6"/><text x="349" y="114.5" fill="#102c3b" font-size="9.5" font-weight="400">Space</text><line x1="117" y1="98" x2="179" y2="55" fill="none" stroke="#147d80" stroke-width="1.3" stroke-linecap="round"/><line x1="179" y1="55" x2="176.313" y2="60.3645" fill="none" stroke="#147d80" stroke-width="1.3" stroke-linecap="round"/><line x1="179" y1="55" x2="173.034" y2="55.6371" fill="none" stroke="#147d80" stroke-width="1.3" stroke-linecap="round"/><line x1="117" y1="120" x2="179" y2="166" fill="none" stroke="#147d80" stroke-width="1.3" stroke-linecap="round"/><line x1="179" y1="166" x2="173.057" y2="165.173" fill="none" stroke="#147d80" stroke-width="1.3" stroke-linecap="round"/><line x1="179" y1="166" x2="176.485" y2="160.552" fill="none" stroke="#147d80" stroke-width="1.3" stroke-linecap="round"/><line x1="289" y1="55" x2="342" y2="99" fill="none" stroke="#147d80" stroke-width="1.3" stroke-linecap="round"/><line x1="342" y1="99" x2="336.111" y2="97.8499" fill="none" stroke="#147d80" stroke-width="1.3" stroke-linecap="round"/><line x1="342" y1="99" x2="339.786" y2="93.4234" fill="none" stroke="#147d80" stroke-width="1.3" stroke-linecap="round"/><line x1="289" y1="166" x2="342" y2="123" fill="none" stroke="#147d80" stroke-width="1.3" stroke-linecap="round"/><line x1="342" y1="123" x2="339.723" y2="128.551" fill="none" stroke="#147d80" stroke-width="1.3" stroke-linecap="round"/><line x1="342" y1="123" x2="336.099" y2="124.084" fill="none" stroke="#147d80" stroke-width="1.3" stroke-linecap="round"/><text x="18" y="216" fill="#ac643e" font-size="9" font-weight="700">One isolated -&gt; reduce load to &lt;=60 kW</text></g></svg>