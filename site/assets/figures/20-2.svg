<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 224" width="880" height="448" role="img" aria-labelledby="figure-title figure-description"><title id="figure-title">Three ways to change the architecture</title><desc id="figure-description">Three ways to change the architecture. Conceptual alternatives with new burdens, not a ranking.</desc><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="440" height="224" rx="7" fill="#f4f1e9" stroke="none" stroke-width="1"/><rect x="16" y="25" width="115" height="48" rx="5" fill="#dfe8e5" stroke="#147d80" stroke-width="0.6"/><text x="23" y="53.5" fill="#102c3b" font-size="9.5" font-weight="400">Remote maintenance</text><text x="143" y="39" fill="#147d80" font-size="10" font-weight="700">Less exterior human work</text><text x="287" y="38.5" fill="#65777c" font-size="9.5" font-weight="400">Robot recovery</text><rect x="16" y="86" width="115" height="48" rx="5" fill="#dfe8e5" stroke="#147d80" stroke-width="0.6"/><text x="23" y="114.5" fill="#102c3b" font-size="9.5" font-weight="400">Replace whole rooms</text><text x="143" y="100" fill="#147d80" font-size="10" font-weight="700">Faster local exchange</text><text x="287" y="99.5" fill="#65777c" font-size="9.5" font-weight="400">Transport and interfaces</text><rect x="16" y="147" width="115" height="48" rx="5" fill="#dfe8e5" stroke="#147d80" stroke-width="0.6"/><text x="23" y="175.5" fill="#102c3b" font-size="9.5" font-weight="400">Separate industry</text><text x="143" y="161" fill="#147d80" font-size="10" font-weight="700">Less local disturbance</text><text x="287" y="160.5" fill="#65777c" font-size="9.5" font-weight="400">Distribution and travel</text><text x="143" y="15" fill="#65777c" font-size="7" font-weight="400">CHANGED CAPABILITY</text><text x="287" y="15" fill="#65777c" font-size="7" font-weight="400">NEW QUESTION</text></g></svg>