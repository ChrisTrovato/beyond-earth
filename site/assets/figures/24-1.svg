<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 224" width="880" height="448" role="img" aria-labelledby="figure-title figure-description"><title id="figure-title">A conditional route to aerospace</title><desc id="figure-description">A conditional route to aerospace. A sequence of foundations, verified transfer preparation, and upper-division study. Placement, articulation and course availability govern timing.</desc><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="440" height="224" rx="7" fill="#f4f1e9" stroke="none" stroke-width="1"/><rect x="20" y="57" width="120" height="109" rx="5" fill="#dfe8e5" stroke="#147d80" stroke-width="0.6"/><text x="30" y="95" fill="#147d80" font-size="23" font-weight="700">01</text><text x="30" y="126" fill="#102c3b" font-size="10" font-weight="400">Build foundations</text><rect x="160" y="57" width="120" height="109" rx="5" fill="#dfe8e5" stroke="#147d80" stroke-width="0.6"/><text x="170" y="95" fill="#147d80" font-size="23" font-weight="700">02</text><text x="170" y="126" fill="#102c3b" font-size="10" font-weight="400">Transfer if ready</text><rect x="300" y="57" width="120" height="109" rx="5" fill="#dfe8e5" stroke="#147d80" stroke-width="0.6"/><text x="310" y="95" fill="#147d80" font-size="23" font-weight="700">03</text><text x="310" y="126" fill="#102c3b" font-size="10" font-weight="400">Degree requirements</text><text x="23" y="203" fill="#65777c" font-size="10" font-weight="400">Official audit, admission and actual offerings govern the route.</text></g></svg>